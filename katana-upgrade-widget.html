<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="tw-bot" content="@SenseiRenderBot">
<title>Katana Upgrade</title>
<style>
:root{
  --bg:#0a0a12;--bg-elev:#121222;--text:#f0f0f5;--muted:#8a8aa0;
  --accent:#00d4aa;--accent-dim:#00b894;--gold:#ffd700;--gold-dim:#e6c200;
  --steel:#b8c5d6;--steel-dim:#94a3b8;--danger:#ff4757;--danger-dim:#e84141;
  --success:#2ed573;--success-dim:#26c468;--glow:#00d4aa;--glow-gold:#ffd700;
  --shadow:rgba(0,0,0,0.6);--card-border:rgba(255,255,255,0.08);
  --gradient-blade:linear-gradient(90deg,#1a1a2e 0%,#2a2a4a 30%,#3a3a6a 60%,#2a2a4a 100%);
  --gradient-gold:linear-gradient(135deg,#ffd700 0%,#ffaa00 50%,#ffd700 100%);
  --gradient-steel:linear-gradient(135deg,#e8ecf1 0%,#b8c5d6 50%,#94a3b8 100%);
  --gradient-danger:linear-gradient(135deg,#ff4757 0%,#ff6b7a 100%);
  --gradient-success:linear-gradient(135deg,#2ed573 0%,#7bed9f 100%);
}
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
html,body{height:100%;overflow:hidden}
body{
  font-family:'SF Pro Display','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:env(safe-area-inset-top,12px) env(safe-area-inset-right,14px) env(safe-area-inset-bottom,12px) env(safe-area-inset-left,14px);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  touch-action:manipulation;
}
.container{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:10px;height:100%}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
  border:1px solid var(--card-border);
  border-radius:16px;
  padding:16px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 32px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.05);
}
.katana-display{text-align:center;padding:8px 0;position:relative}
.katana-forge{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;overflow:hidden;border-radius:12px;
  opacity:0;transition:opacity 0.3s ease;
}
.katana-forge.active{opacity:1}
.forge-particle{
  position:absolute;width:4px;height:4px;background:var(--gold);
  border-radius:50%;pointer-events:none;
  animation:forge-rise 1.2s ease-out forwards;
}
@keyframes forge-rise{
  0%{transform:translate(var(--tx,0),var(--ty,0)) scale(1);opacity:1}
  100%{transform:translate(var(--tx-end,0),var(--ty-end,-120px)) scale(0);opacity:0}
}
.katana-art{
  font-family:'JetBrains Mono','Fira Code','Courier New',monospace;
  font-size:14px;line-height:1.15;
  color:var(--steel);white-space:pre;
  overflow-x:auto;
  filter:drop-shadow(0 0 8px rgba(184,197,214,0.3));
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  cursor:default;
  user-select:none;
  position:relative;
  z-index:1;
}
.katana-art.growing{animation:blade-grow 0.6s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes blade-grow{
  0%{transform:scaleX(0.7);filter:drop-shadow(0 0 4px rgba(184,197,214,0.2))}
  50%{filter:drop-shadow(0 0 20px rgba(0,212,170,0.8))}
  100%{transform:scaleX(1);filter:drop-shadow(0 0 8px rgba(184,197,214,0.3))}
}
.katana-art.glow-success{animation:blade-success 0.8s ease-out}
@keyframes blade-success{
  0%,100%{filter:drop-shadow(0 0 8px rgba(184,197,214,0.3))}
  50%{filter:drop-shadow(0 0 24px rgba(46,213,115,0.9))}
}
.katana-art.glow-fail{animation:blade-fail 0.6s ease-out}
@keyframes blade-fail{
  0%,100%{filter:drop-shadow(0 0 8px rgba(184,197,214,0.3))}
  50%{filter:drop-shadow(0 0 20px rgba(255,71,87,0.9))}
}
.katana-art::before{
  content:'';
  position:absolute;top:50%;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--steel),transparent);
  opacity:0.3;pointer-events:none;
  transform:translateY(-50%);
}
.katana-name{
  font-weight:700;color:var(--gold);margin:10px 0 4px;
  font-size:16px;letter-spacing:0.3px;
  background:var(--gradient-gold);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,215,0,0.4));
}
.katana-rank{
  color:var(--accent);opacity:0.9;font-size:12px;font-weight:500;
  text-transform:uppercase;letter-spacing:1.5px;
}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{text-align:center;padding:10px 6px;background:rgba(0,0,0,0.35);border-radius:12px;border:1px solid rgba(255,255,255,0.05);transition:transform 0.2s ease,box-shadow 0.2s ease}
.stat:active{transform:scale(0.96)}
.stat-value{
  font-size:19px;font-weight:800;color:var(--gold);
  font-variant-numeric:tabular-nums;
  background:var(--gradient-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}
.upgrade-section{text-align:center;padding:4px 0}
.cost-display{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:18px;font-size:16px;font-weight:600;
}
.coin-icon{font-size:22px;animation:coin-spin 3s linear infinite;display:inline-block}
@keyframes coin-spin{0%,50%,100%{transform:rotateY(0deg)}25%{transform:rotateY(90deg)}75%{transform:rotateY(270deg)}}
.cost-value{color:var(--gold);font-weight:800;background:var(--gradient-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.btn{
  width:100%;padding:16px 28px;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:all 0.15s ease;touch-action:manipulation;
  position:relative;overflow:hidden;
}
.btn:active:not(:disabled){transform:scale(0.97)}
.btn:disabled{opacity:0.55;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dim) 100%);
  color:#0a0a12;box-shadow:0 4px 20px rgba(0,212,170,0.35),inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-primary:not(:disabled):active{filter:brightness(1.15);box-shadow:0 2px 12px rgba(0,212,170,0.5),inset 0 1px 0 rgba(255,255,255,0.3)}
.btn-primary:not(:disabled):hover{box-shadow:0 6px 28px rgba(0,212,170,0.45),inset 0 1px 0 rgba(255,255,255,0.25)}
.btn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  transition:left 0.5s ease;
}
.btn:not(:disabled):hover::before{left:100%}
.loading{
  display:inline-block;width:18px;height:18px;
  border:2.5px solid transparent;border-top-color:currentColor;
  border-radius:50%;animation:spin 0.9s linear infinite;
  margin-left:10px;vertical-align:middle;opacity:0;transition:opacity 0.2s;
}
.btn.loading .loading{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.result-section{
  display:none;text-align:center;padding:18px 0;
  animation:slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.result-section.show{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.result-status{font-size:22px;font-weight:800;margin-bottom:10px;letter-spacing:0.5px}
.result-status.success{color:var(--success);text-shadow:0 0 16px rgba(46,213,115,0.6)}
.result-status.fail{color:var(--danger);text-shadow:0 0 16px rgba(255,71,87,0.6)}
.result-growth{
  font-size:18px;font-weight:700;margin-bottom:10px;
  font-variant-numeric:tabular-nums;
}
.result-new-length{font-size:14px;color:var(--muted);font-weight:500}
.cooldown-info{
  font-size:12px;color:var(--muted);margin-top:14px;padding:10px 12px;
  background:rgba(255,255,255,0.04);border-radius:10px;border:1px solid rgba(255,255,255,0.05);
  display:none;
}
.cooldown-info.show{display:block;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
.error-message{
  color:var(--danger);font-size:13px;margin-top:12px;padding:12px 14px;
  background:rgba(255,71,87,0.12);border:1px solid rgba(255,71,87,0.2);
  border-radius:10px;display:none;animation:shake 0.4s ease-out;
}
.error-message.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hint{font-size:11px;color:var(--muted);margin-top:16px;text-align:center;opacity:0.7}
.katana-sheen{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.08) 50%,transparent 100%);
  transform:translateX(-100%);animation:sheen 3s ease-in-out infinite;pointer-events:none;
}
@keyframes sheen{0%{transform:translateX(-100%)}50%,100%{transform:translateX(200%)}}
.tier-badge{
  display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;margin-left:8px;vertical-align:middle;
}
.tier-I{background:rgba(184,197,214,0.2);color:var(--steel)}
.tier-II{background:rgba(0,212,170,0.2);color:var(--accent)}
.tier-III{background:rgba(138,43,226,0.2);color:#ba55d3}
.tier-IV{background:rgba(255,215,0,0.2);color:var(--gold)}
.tier-V{background:rgba(255,100,100,0.2);color:#ff6464}
.tier-VI{background:rgba(255,50,50,0.25);color:#ff3232}
.tier-VII{background:rgba(100,200,255,0.2);color:#64c8ff}
.tier-VIII{background:rgba(180,100,255,0.2);color:#b464ff}
.tier-IX{background:rgba(255,215,0,0.3);color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,0.4)}
.tier-X{background:rgba(255,100,100,0.3);color:#ff6464;box-shadow:0 0 12px rgba(255,100,100,0.4)}
.tier-XI{background:linear-gradient(135deg,#ffd700,#ff3232);color:#0a0a12;box-shadow:0 0 20px rgba(255,215,0,0.6),0 0 40px rgba(255,50,50,0.4)}
/* Blade shimmer effect */
.blade-shimmer{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.15) 50%,transparent 100%);
  transform:translateX(-100%);animation:blade-sheen 4s ease-in-out infinite;pointer-events:none;
  border-radius:12px;
}
@keyframes blade-sheen{0%{transform:translateX(-100%)}50%,100%{transform:translateX(200%)}}
/* Ambient glow */
.ambient-glow{
  position:fixed;top:50%;left:50%;width:300px;height:300px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(0,212,170,0.08) 0%,transparent 70%);
  pointer-events:none;z-index:-1;animation:ambient-pulse 6s ease-in-out infinite;
}
@keyframes ambient-pulse{0%,100%{opacity:0.4;transform:translate(-50%,-50%) scale(1)}50%{opacity:0.8;transform:translate(-50%,-50%) scale(1.15)}}
/* Tier indicator ring */
.tier-ring{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--accent),var(--gold),var(--accent));
  animation:tier-spin 8s linear infinite;margin-left:8px;
}
.tier-ring::before{
  content:'';position:absolute;width:28px;height:28px;border-radius:50%;background:var(--bg);
}
.tier-ring span{position:relative;z-index:1;font-weight:800;font-size:11px;color:var(--text)}
@keyframes tier-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ambient-glow"></div>
<div class="container">
  <div class="card">
    <div class="katana-display">
      <div class="katana-forge" id="forge"></div>
      <div class="katana-sheen"></div>
      <div class="blade-shimmer"></div>
      <div class="katana-art" id="kArt">⟦■⟧╦════►</div>
      <div class="katana-name" id="kName">НОЖ Дно-Копателя<span class="tier-badge tier-I">I</span></div>
      <div class="katana-rank" id="kRank">Ранг I</div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-value" id="sLen">0.0</div><div class="stat-label">Длина (см)</div></div>
        <div class="stat"><div class="stat-value" id="sCoins">0</div><div class="stat-label">Монеты</div></div>
        <div class="stat"><div class="stat-value" id="sCost">0</div><div class="stat-label">След. цена</div></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="upgrade-section">
      <div class="cost-display"><span class="coin-icon">💰</span>Стоимость: <span class="cost-value" id="uCost">0</span></div>
      <button class="btn btn-primary" id="uBtn" onclick="upg()">
        ⚔️ Улучшить катану<span class="loading" id="spin"></span>
      </button>
      <div class="result-section" id="res">
        <div class="result-status" id="rStatus"></div>
        <div class="result-growth" id="rGrowth"></div>
        <div class="result-new-length" id="rNewLen"></div>
      </div>
      <div class="error-message" id="err"></div>
      <div class="cooldown-info" id="cd"></div>
    </div>
  </div>
  <div class="hint">Нажмите кнопку, чтобы попытаться улучшить катану. Результат зависит от удачи!</div>
</div>
<script>
const TW=window.TelegramWidget;
let s={kLen:0,kName:"",kRank:"",kArt:"",coins:0,uCost:0,cd:0,hasK:false,tier:1,lastUpgrade:null};
const T=[
  {l:5,h:"⟦■⟧",g:"╦",r:"",R:"I",n:"НОЖ Дно-Копателя",t:1},
  {l:7,h:"⟦■■⟧",g:"╦",r:"",R:"I",n:"Шард-лезвие",t:1},
  {l:10,h:"⟦■■■⟧",g:"╬",r:"",R:"II",n:"Великий HODL-Меч",t:2},
  {l:14,h:"⟦▣▣⟧",g:"╬",r:"",R:"III",n:"Нейронный вакидзаси",t:3},
  {l:19,h:"⟦▣✦▣⟧",g:"╬",r:"✦",R:"IV",n:"КАТАНА ДУРОВА",t:4},
  {l:23,h:"⟦≣▣▣≣⟧",g:"╬",r:"✦",R:"V",n:"ГОЙСКИЙ КЛИНОК",t:5},
  {l:29,h:"⟦✦✦✦⟧",g:"◈",r:"✦",R:"VI",n:"Red Blood Tanto",t:6},
  {l:38,h:"⟦☾☾⟧",g:"◈",r:"☾",R:"VII",n:"Хеш-клинок Сатоши",t:7},
  {l:48,h:"⟦☯☯☯⟧",g:"◈",r:"☯",R:"VIII",n:"DAO-клинок",t:8},
  {l:60,h:"⟦⚔⚔⟧",g:"✦",r:"⚔",R:"IX",n:"НАГАМАКИ ЧЕРНЫЙ-ЛЕБЕДЬ",t:9},
  {l:80,h:"⟦⚔⚔⚔⟧",g:"✦",r:"⚔",R:"X",n:"НАГИНАТО-СБРИВАТОР",t:10},
  {l:1/0,h:"⟦☯⚔☯⟧",g:"✧",r:"☯",R:"XI",n:"УБИЙЦА БОГОВ",t:11}
];
function cl(n,lo,hi){return Math.max(lo,Math.min(hi,n))}
function kArt(len){
  const bl=cl(Math.round(len*.28)+6,6,16);
  for(const t of T){if(len<t.l){
    let b;
    if(!t.r||bl<=10)b="═".repeat(bl);
    else{const l=Math.floor(bl/2)-1;b="═".repeat(l)+t.r+"═".repeat(bl-l-1)}
    return t.h+t.g+b+"►"
  }}return""
}
function kInfo(len){
  for(const t of T)if(len<t.l)return{n:t.n,R:t.R,t:t.t};
  return{n:"Unknown",R:"I",t:1};
}
function fmt(n){return n.toLocaleString("ru-RU")}
function tm(s){
  if(s<=0)return"0с";
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h?`${h}ч ${m}м`:(m?`${m}м ${sec}с`:`${sec}с`);
}
function spawnForgeParticles(count){
  const forge=document.getElementById("forge");
  forge.classList.add("active");
  const rect=forge.getBoundingClientRect();
  for(let i=0;i<count;i++){
    const p=document.createElement("div");
    p.className="forge-particle";
    const angle=(Math.random()-0.5)*0.8;
    const dist=60+Math.random()*80;
    const tx=(Math.random()-0.5)*40;
    const txEnd=tx+Math.sin(angle)*dist;
    const ty=rect.height/2+10;
    const tyEnd=-dist*Math.cos(angle);
    p.style.setProperty("--tx",`${tx}px`);
    p.style.setProperty("--ty",`${ty}px`);
    p.style.setProperty("--tx-end",`${txEnd}px`);
    p.style.setProperty("--ty-end",`${tyEnd}px`);
    p.style.left=`${rect.width/2+tx}px`;
    p.style.top=`${ty}px`;
    p.style.background=Math.random()<0.5?"var(--gold)":"var(--accent)";
    p.style.boxShadow=`0 0 8px ${p.style.background}`;
    forge.appendChild(p);
    setTimeout(()=>p.remove(),1200);
  }
  setTimeout(()=>forge.classList.remove("active"),1200);
}
function upd(){
  const newArt=kArt(s.kLen);
  const artEl=document.getElementById("kArt");
  const nameEl=document.getElementById("kName");
  const rankEl=document.getElementById("kRank");
  const wasGrowing=artEl.dataset.prevLen!==undefined&&s.kLen>parseFloat(artEl.dataset.prevLen);
  artEl.dataset.prevLen=s.kLen;
  artEl.textContent=newArt||kArt(s.kLen);
  nameEl.innerHTML=s.kName+`<span class="tier-badge tier-${s.tier}">${s.kRank}</span>`;
  rankEl.textContent="Ранг "+s.kRank;
  document.getElementById("sLen").textContent=s.kLen.toFixed(1);
  document.getElementById("sCoins").textContent=fmt(s.coins);
  document.getElementById("sCost").textContent=fmt(s.uCost);
  document.getElementById("uCost").textContent=fmt(s.uCost);
  const b=document.getElementById("uBtn"),e=document.getElementById("err"),c=document.getElementById("cd");
  if(s.cd>0){
    b.disabled=!0;b.classList.add("loading");
    b.innerHTML=`⏳ Подождите ${tm(s.cd)}<span class="loading" id="spin"></span>`;
    c.textContent=`Следующая попытка через: ${tm(s.cd)}`;c.classList.add("show")}
  else if(!s.hasK){
    b.disabled=!0;b.classList.remove("loading");b.textContent="❌ Нет катаны";
    e.textContent="У вас нет катаны! Купите её в профиле.";e.classList.add("show");c.classList.remove("show")}
  else if(s.coins<s.uCost){
    b.disabled=!0;b.classList.remove("loading");b.textContent="💰 Недостаточно монет";
    e.textContent=`Нужно ${fmt(s.uCost)} монет, у вас ${fmt(s.coins)}`;e.classList.add("show");c.classList.remove("show")}
  else{
    b.disabled=!1;b.classList.remove("loading");b.innerHTML='⚔️ Улучшить катану<span class="loading" id="spin"></span>';
    e.classList.remove("show");c.classList.remove("show")}
  document.getElementById("res").classList.remove("show");
  if(wasGrowing){artEl.classList.add("growing");setTimeout(()=>artEl.classList.remove("growing"),600)}
}
function showRes(r){
  const sec=document.getElementById("res"),st=document.getElementById("rStatus"),gr=document.getElementById("rGrowth"),nl=document.getElementById("rNewLen"),art=document.getElementById("kArt");
  if(r.up){
    st.textContent="✅ УСПЕХ!";st.className="result-status success";
    gr.textContent="+"+r.g.toFixed(2)+" см";gr.style.color="var(--success)";
    art.classList.add("glow-success");
    spawnForgeParticles(18);
    setTimeout(()=>art.classList.remove("glow-success"),800);
  }else{
    st.textContent="💔 НЕУДАЧА";st.className="result-status fail";
    gr.textContent=(r.g>=0?"-":"")+Math.abs(r.g).toFixed(2)+" см";gr.style.color="var(--danger)";
    art.classList.add("glow-fail");
    setTimeout(()=>art.classList.remove("glow-fail"),600);
  }
  nl.textContent=`Новая длина: ${r.nl.toFixed(1)} см (Ранг ${kInfo(r.nl).R})`;
  sec.classList.add("show");
  if(TW&&TW.HapticFeedback)TW.HapticFeedback.notificationOccurred(r.up?"success":"error")
}
function err(m){const e=document.getElementById("err");e.textContent=m;e.classList.add("show")}
function ld(loading){
  const b=document.getElementById("uBtn"),sp=document.getElementById("spin");
  b.disabled=loading;
  if(loading)b.classList.add("loading");else b.classList.remove("loading");
  sp.style.display=loading?"inline-block":"none"
}
async function upg(){
  if(!TW){err("Виджет не загружен в Telegram");return}
  ld(!0);
  try{
    const r=await TW.request("widget:upgrade_katana");
    if(r&&r.result){
      const d=JSON.parse(r.result);
      if(d.success){
        const oldLen=s.kLen;
        s.kLen=d.new_length;s.coins=d.new_coins;s.uCost=d.next_cost;s.cd=d.cooldown_remaining||0;
        const i=kInfo(s.kLen);s.kName=i.n;s.kRank=i.R;s.tier=i.t;s.kArt=kArt(s.kLen);
        showRes({up:d.is_upgraded,g:d.growth,nl:d.new_length});
        upd();
      }else{err(d.error||"Ошибка при улучшении");if(d.cooldown_remaining){s.cd=d.cooldown_remaining;upd()}}
    }else err("Неизвестный ответ от сервера");
  }catch(e){console.error("Upgrade error:",e);let m="Ошибка соединения";if(e.message){if(e.message.includes("NOT_ALLOWED"))m="Действие недоступно";else if(e.message.includes("TIMEOUT"))m="Таймаут запроса";else if(e.message.includes("FLOOD_WAIT"))m="Слишком много запросов, подождите";else m=e.message}err(m)}finally{ld(!1)}
}
function init(){
  if(!TW)return;
  if(TW.chatData)try{const d=JSON.parse(TW.chatData);if(d.katanaLength!==void 0)s.kLen=d.katanaLength;if(d.coins!==void 0)s.coins=d.coins;if(d.upgradeCost!==void 0)s.uCost=d.upgradeCost;if(d.cooldownRemaining!==void 0)s.cd=d.cooldownRemaining;if(d.hasKatana!==void 0)s.hasK=d.hasKatana}catch(e){}
  if(TW.publicData)try{const d=JSON.parse(TW.publicData);if(d.katanaLength!==void 0)s.kLen=d.katanaLength;if(d.coins!==void 0)s.coins=d.coins;if(d.upgradeCost!==void 0)s.uCost=d.upgradeCost;if(d.cooldownRemaining!==void 0)s.cd=d.cooldownRemaining;if(d.hasKatana!==void 0)s.hasK=d.hasKatana}catch(e){}
  const i=kInfo(s.kLen);s.kName=i.n;s.kRank=i.R;s.tier=i.t;s.kArt=kArt(s.kLen);upd()}
if(TW){TW.onEvent("chatDataChanged",init);TW.onEvent("publicDataChanged",init);TW.ready()}else document.addEventListener("DOMContentLoaded",init);
init();
</script>
