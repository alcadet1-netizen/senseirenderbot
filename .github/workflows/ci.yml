name: Tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: '123456:TEST'
      CAMPAIGN_TEST_MONGO_URI: 'mongodb://127.0.0.1:27017/?replicaSet=rs0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build pinned MTProto layer-233 runtime (no credentials)
        run: python -m src.infra.mtproto.bootstrap
      - name: Start real MongoDB replica set for campaign integration tests
        run: |
          docker run --detach --name campaign-mongo --publish 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          python -m scripts.start_test_mongo
      - name: Run tests
        run: python -m pytest -q --junitxml=.cache/test-results.xml
      - name: Annotate test failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path(".cache/test-results.xml")
          if path.exists():
              for case in ET.parse(path).iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      text = (failure.text or failure.get("message", ""))[:12000]
                      text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={case.get('name')}::{text}")
          PY
      - name: Check production imports and widget router
        run: |
          python - <<'PY'
          from src.main import main
          from src.bot.handlers import setup_routers
          assert any(r.name == 'widgets' for r in setup_routers().sub_routers)
          PY
      - name: Check HTML in official Telegram QuickJS sandbox
        run: python -m scripts.check_widgets
      - name: Check Mini App JavaScript
        run: |
          node --check src/web/hedgehog/app.js
          node --check src/web/daily_pet/app.js
      - name: Check startup script
        run: bash -n start.sh
