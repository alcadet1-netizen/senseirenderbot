name: Tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: '123456:TEST'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check production imports and widget router
        run: |
          python - <<'PY'
          from src.main import main
          from src.bot.handlers import setup_routers
          assert any(r.name == 'widgets' for r in setup_routers().sub_routers)
          PY
      - name: Check HTML in official Telegram QuickJS sandbox
        run: python -m scripts.check_widgets
      - name: Check Mini App JavaScript
        run: node --check src/web/hedgehog/app.js
      - name: Check startup script
        run: bash -n start.sh
