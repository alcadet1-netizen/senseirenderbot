services:
  app:
    build: .
    container_name: sensei_bot
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./src/infra/storage/ega:/app/src/infra/storage/ega
    networks:
      - sensei_network

  postgres:
    image: dockerhub.timeweb.cloud/library/postgres:16-alpine
    container_name: sensei_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensei_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-sensei_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensei -d sensei_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - sensei_network

  redis:
    image: dockerhub.timeweb.cloud/library/redis:7-alpine
    container_name: sensei_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sensei_network

volumes:
  postgres_data:
  redis_data:

networks:
  sensei_network:
    driver: bridge